    // FOUC önleme — HooDoo her zaman dark, localStorage 'light' değilse dark aktif

      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
